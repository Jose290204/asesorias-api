services:
  app:
    build: ./docker/php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: asesorias
      MYSQL_USER: asesorias
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit
    ports:
      - "8026:8025"

  queue:
    build: ./docker/php
    command: php artisan queue:work --tries=3
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql

  scheduler:
    build: ./docker/php
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql

volumes:
  mysql_data: