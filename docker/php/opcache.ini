; 1: activa la caché de código compilado
opcache.enable=1
; 2: memoria para guardar los scripts compilados (MB)
opcache.memory_consumption=256
; 3: cuántos archivos puede guardar (Laravel + vendor son muchos)
opcache.max_accelerated_files=20000
; 4: en desarrollo, revisa si un archivo cambió (si lo pones en 0, no verá tus cambios sin reiniciar)
opcache.validate_timestamps=1
; 5: cada cuántos segundos revisa cambios; con el volumen lento conviene que no sea cada petición
opcache.revalidate_freq=2
; 6: guarda las rutas de archivos resueltas, evita muchas consultas al sistema de archivos
realpath_cache_size=4096K
realpath_cache_ttl=600